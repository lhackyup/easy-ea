# ==============================================================================
# EasyEA - Development / Preview Blueprint (Branch: develop + Neon Dev DB)
# Render.com Infrastructure-as-Code
# ==============================================================================

services:
  - type: web
    name: easyea-dev
    runtime: image
    image:
      url: ghcr.io/lhackyup/easy-ea:develop
    plan: free
    region: frankfurt # opzioni: frankfurt, oregon, ohio, singapore
    envVars:
      - key: PORT
        value: 8000
      - key: EASYEA_ENV
        value: development
      - key: EASYEA_SECRET_KEY
        generateValue: true
      - key: EASYEA_SEED_DEMO_USERS
        value: "true" # Popola automaticamente gli utenti e dati di test/demo
      - key: EASYEA_RBAC_MODE
        value: hybrid
      - key: EASYEA_DRAWIO_WEB_URL
        value: https://easyea-drawio-dev.onrender.com
      - key: EASYEA_CORS_ORIGINS
        value: https://easyea-dev.onrender.com,https://easyea-drawio-dev.onrender.com,https://embed.diagrams.net,null,file://
      - key: DATABASE_URL
        sync: false # Impostato con la stringa di connessione di Neon.tech (Dev DB)

  - type: web
    name: easyea-drawio-dev
    runtime: image
    image:
      url: docker.io/jgraph/drawio:latest
    plan: free
    region: frankfurt
    envVars:
      - key: PORT
        value: 8080
      - key: DRAWIO_BASE_URL
        value: https://easyea-drawio-dev.onrender.com
