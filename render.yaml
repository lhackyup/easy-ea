# ==============================================================================
# EasyEA - Production Blueprint (Branch: main)
# Render.com Infrastructure-as-Code
# ==============================================================================

services:
  - type: web
    name: easyea-app-prod
    runtime: image
    image:
      url: ghcr.io/lhackyup/easy-ea:latest
    plan: free
    region: frankfurt # opzioni: frankfurt, oregon, ohio, singapore
    envVars:
      - key: PORT
        value: 8000
      - key: EASYEA_ENV
        value: production
      - key: EASYEA_SECRET_KEY
        generateValue: true
      - key: EASYEA_SEED_DEMO_USERS
        value: "false"
      - key: EASYEA_RBAC_MODE
        value: hybrid
      - key: DATABASE_URL
        fromDatabase:
          name: easyea-postgres-prod
          property: connectionString

databases:
  - name: easyea-postgres-prod
    databaseName: easyea_prod
    user: easyea_user
    plan: free
    region: frankfurt
