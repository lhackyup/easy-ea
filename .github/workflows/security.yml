name: Security Checks & SAST/SCA

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -----------------------------------------------------------
  # 1. Secret Scanning (Gitleaks)
  # -----------------------------------------------------------
  secret-scan:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # -----------------------------------------------------------
  # 2. SCA & SAST Backend (Python)
  # -----------------------------------------------------------
  backend-security:
    name: Backend SAST, SCA & Security Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pip-audit bandit pytest

      - name: SCA - pip-audit (Vulnerability Scan)
        run: |
          pip-audit -r backend/requirements.txt

      - name: SAST - Bandit (Static Analysis)
        run: |
          bandit -r backend/app -ll -ii

      - name: Run Security Regression Tests
        env:
          EASYEA_SECRET_KEY: "ci-cd-ephemeral-super-secret-key-384-bits-long-for-testing-only"
        run: |
          PYTHONPATH=backend pytest backend/tests/test_pinned_dependencies.py \
                                    backend/tests/test_csp_hsts.py \
                                    backend/tests/test_token_revocation.py \
                                    backend/tests/test_mfa.py \
                                    backend/tests/test_audit_trail.py

  # -----------------------------------------------------------
  # 3. SCA & Build Frontend (Node.js)
  # -----------------------------------------------------------
  frontend-security:
    name: Frontend SCA & Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: SCA - npm audit (Production Dependencies)
        run: npm audit --omit=dev --audit-level=high

      - name: TypeScript Typecheck & Production Build
        run: npm run build
