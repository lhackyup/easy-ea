# ==============================================================================
# EasyEA - Live Demo Blueprint (Neon Database + Demo Users Seed)
# Render.com Infrastructure-as-Code
# ==============================================================================

services:
  - type: web
    name: easyea-demo
    runtime: image
    image:
      url: ghcr.io/lhackyup/easy-ea:latest
    plan: free
    region: frankfurt # opzioni: frankfurt, oregon, ohio, singapore
    envVars:
      - key: PORT
        value: 8000
      - key: EASYEA_ENV
        value: production
      - key: EASYEA_SECRET_KEY
        generateValue: true
      - key: EASYEA_SEED_DEMO_USERS
        value: "true" # Popola automaticamente gli utenti e dati demo
      - key: EASYEA_RBAC_MODE
        value: hybrid
      - key: EASYEA_DRAWIO_WEB_URL
        value: https://easyea-drawio-demo.onrender.com
      - key: EASYEA_CORS_ORIGINS
        value: https://easyea-demo.onrender.com,https://easyea-drawio-demo.onrender.com,https://embed.diagrams.net,null,file://
      - key: DATABASE_URL
        sync: false # Impostato con la stringa di connessione di Neon.tech

  - type: web
    name: easyea-drawio-demo
    runtime: image
    image:
      url: docker.io/jgraph/drawio:latest
    plan: free
    region: frankfurt
    envVars:
      - key: PORT
        value: 8080
      - key: DRAWIO_BASE_URL
        value: https://easyea-drawio-demo.onrender.com
